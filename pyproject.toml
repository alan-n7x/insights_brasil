[project]
name = "insights-brasil"
version = "0.1.0"
description = "Plataforma de BI para indicadores socioeconomicos brasileiros"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django==6.0.6",
    "django-environ==0.11.2",
    "django-filter==24.3",
    "djangorestframework==3.15.2",
    "drf-spectacular==0.27.2",
    "pandas>=2.0",
    "plotly>=5.18",
    "python-dateutil==2.9.0.post0",
    "requests==2.32.3",
    "streamlit>=1.28",
    "urllib3==2.2.3",
    "whitenoise==6.8.2",
]

[dependency-groups]
dev = [
    "coverage==7.6.1",
    "factory-boy==3.3.1",
    "pytest==8.3.3",
    "pytest-cov==6.0.0",
    "pytest-django==4.9.0",
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend", "backend/apps"]
testpaths = ["backend/apps/ibge/tests"]

[tool.coverage.run]
source = ["backend/apps/ibge"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
