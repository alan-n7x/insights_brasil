name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_ENGINE: django.db.backends.sqlite3
      SQLITE_NAME: ${{ github.workspace }}/backend/test.sqlite3
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-secret-key-with-at-least-50-characters-123456789
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Instalar dependências
        run: pip install -r backend/requirements/development.txt

      - name: Validar configuração Django
        run: python backend/manage.py check --deploy
        env:
          DJANGO_SECURE_SSL_REDIRECT: "True"
          DJANGO_SECURE_HSTS_SECONDS: "3600"

      - name: Verificar migrations pendentes
        run: python backend/manage.py makemigrations --check --dry-run

      - name: Executar testes com cobertura
        run: pytest --cov=backend/apps/ibge --cov-report=term-missing --cov-fail-under=70

      - name: Validar sintaxe do frontend
        run: python -m compileall -q frontend
